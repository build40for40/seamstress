<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{Company name}}: board preview</title>
<style>
body{margin:0;font:14px/1.45 Inter,system-ui,sans-serif;background:#f7f8fa;color:#1f2430}
header{padding:16px 20px;border-bottom:1px solid #e3e6ec;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font:600 22px/1.2 Inter,system-ui,sans-serif}
.tag{font-size:12px;font-weight:600;color:#3b4a8a;background:#e6eafb;border-radius:99px;padding:4px 10px}
.board{display:flex;gap:12px;overflow-x:auto;padding:16px 20px 24px}
.col{flex:0 0 230px;background:#fff;border:1px solid #e3e6ec;border-radius:12px;padding:10px}
.col h2{margin:0 0 4px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.count{margin-left:auto;color:#5b6475;font-weight:500}
.card{border:1px solid #e3e6ec;border-radius:10px;padding:9px 11px;margin-top:8px;background:#fff;box-shadow:0 1px 2px rgba(31,36,48,.06)}
.card b{display:block;font-weight:600}
.meta{display:block;color:#5b6475;font-size:12px;margin-top:2px}
.gap{color:#a45a0b}
.empty{color:#8a93a3;font-size:12px;font-style:italic;margin:8px 0 2px}
footer{padding:0 20px 20px;color:#5b6475;font-size:12px}
@media (prefers-color-scheme:dark){
body{background:#14171d;color:#e8eaf0}
header,.col,.card{border-color:#2b303b}
.col,.card{background:#1c2027}
.tag{background:#262d4a;color:#b9c4f5}
.meta,.count,footer{color:#9aa3b5}
}
</style></head><body>
<header><h1>{{Company name}}</h1><span class="tag">{{Preview of your board | Live in Superthread}}</span></header>
<div class="board">
  <div class="col">
    <h2><span class="dot" style="background:{{colour}}"></span>{{Stage}}<span class="count">{{n}}</span></h2>
    <div class="card"><b>{{Client}} – {{job}}</b><span class="meta">{{Who's working on it}} · {{done}} of {{total}} steps</span><span class="meta gap">{{a gap, e.g. deposit to confirm}}</span></div>
    <!-- or, for a stage with no jobs: <p class="empty">Nothing here yet</p> -->
  </div>
</div>
<footer>{{Team: …}} · {{Billing: …}}</footer>
</body></html>
