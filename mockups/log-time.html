<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log time · Seamless mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
<style>
body{margin:0;background:#EFE6E3;display:flex;justify-content:center}
body>div{width:100%!important;max-width:390px;height:100dvh!important;min-height:640px}
a{color:#2B1B33;text-decoration:none}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF6F4 repeating-linear-gradient(90deg, rgba(43, 27, 51, 0.04) 0 1px, transparent 1px 14px); color: #2B1B33; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
<div aria-hidden="true" style="flex: none; height: 18px; background-color: #2B1B33; background-image: repeating-linear-gradient(90deg, #FBF6F4 0 1.5px, transparent 1.5px 40px), repeating-linear-gradient(90deg, #CBB9C9 0 1px, transparent 1px 8px); background-size: 100% 12px, 100% 6px; background-repeat: no-repeat; background-position: left bottom, left bottom"></div>
<div style="padding: 20px 20px 0">
<a href="order.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; font-weight: 600; color: #6A5870">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6A5870" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
Velvet evening coat
</a>
</div>
<div style="flex: 1; padding: 4px 20px 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="align-self: flex-start; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #6B2443; background: #F3E1E7; border: 1px dashed #B58A9B; border-radius: 4px; padding: 3px 9px">SE-1002</span>
<h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 28px; font-weight: 600; line-height: 1.15">Clock it</h1>
</div>
<div style="background: #FFFFFF; border: 1px solid #E8DCD9; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #6A5870">How long?</h2>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" aria-label="Half an hour less" id="less" style="width: 60px; height: 60px; border-radius: 6px; border: 1.5px solid #2B1B33; background: #FFFFFF; color: #2B1B33; font-size: 30px; font-family: inherit; cursor: pointer">&minus;</button>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-family: 'Playfair Display', Georgia, serif; font-size: 52px; font-weight: 600; line-height: 1"><span class="js-hours">2</span></span>
<span style="font-size: 15px; color: #6A5870"><span class="js-unit">hours</span></span>
</div>
<button type="button" aria-label="Half an hour more" id="more" style="width: 60px; height: 60px; border-radius: 6px; border: 1.5px solid #2B1B33; background: #FFFFFF; color: #2B1B33; font-size: 30px; font-family: inherit; cursor: pointer">+</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #6A5870">What was it?</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" class="js-kind" aria-pressed="false" style="height: 52px; border-radius: 6px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; border: 1.5px solid #C9B9BF; background: #FFFFFF; color: #2B1B33">Sewing</button>
<button type="button" class="js-kind" aria-pressed="true" style="height: 52px; border-radius: 6px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; border: 1.5px solid #2B1B33; background: #2B1B33; color: #FFFFFF">Fitting</button>
<button type="button" class="js-kind" aria-pressed="false" style="height: 52px; border-radius: 6px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; border: 1.5px solid #C9B9BF; background: #FFFFFF; color: #2B1B33">Tidying up</button>
</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #E8DCD9; border-radius: 6px; padding: 4px 16px; display: flex; align-items: center; justify-content: space-between; min-height: 56px; box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 600; color: #6A5870">When?</span>
<span style="font-size: 16px; font-weight: 600">Today, Tue 10 Nov</span>
</div>
<button type="button" style="min-height: 44px; padding: 0 4px; border: 0; background: none; font-size: 15px; font-weight: 600; font-family: inherit; color: #7A2E4D; cursor: pointer">Change</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="note" style="font-size: 13px; font-weight: 600; color: #6A5870">Anything I should know?</label>
<textarea id="note" rows="2" placeholder="Fitting for the cuffs" style="box-sizing: border-box; width: 100%; border: 1px solid #C9B9BF; border-radius: 6px; padding: 12px 14px; font-size: 16px; font-family: inherit; color: #2B1B33; background: #FFFFFF; resize: none"></textarea>
</div>
</div>
<div style="padding: 16px 20px 24px; background: #FFFFFF; border-top: 1px solid #E8DCD9">
<a href="saved.html" style="height: 56px; border-radius: 6px; background: #7A2E4D; outline: 1.5px dashed rgba(255, 255, 255, 0.6); outline-offset: -6px; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center"><span>Save <span class="js-hours">2</span> <span class="js-unit">hours</span></span></a>
</div>
</div>
<script>
var hours = 2, ON = "height: 52px; border-radius: 6px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; border: 1.5px solid #2B1B33; background: #2B1B33; color: #FFFFFF", OFF = "height: 52px; border-radius: 6px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; border: 1.5px solid #C9B9BF; background: #FFFFFF; color: #2B1B33";
function show() {
  document.querySelectorAll(".js-hours").forEach(function (e) { e.textContent = hours; });
  document.querySelectorAll(".js-unit").forEach(function (e) { e.textContent = hours === 1 ? "hour" : "hours"; });
}
document.getElementById("less").onclick = function () { hours = Math.max(0.5, hours - 0.5); show(); };
document.getElementById("more").onclick = function () { hours = Math.min(16, hours + 0.5); show(); };
document.querySelectorAll(".js-kind").forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll(".js-kind").forEach(function (o) { o.setAttribute("aria-pressed", o === b); o.style.cssText = o === b ? ON : OFF; });
  };
});
</script>
</body>
</html>
