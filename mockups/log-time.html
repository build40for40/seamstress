<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log time · Seamstress mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
body{margin:0;background:#E3E6EC;display:flex;justify-content:center}
body>div{width:100%!important;max-width:390px;height:100dvh!important;min-height:640px}
a{color:#14213D;text-decoration:none}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; color: #14213D; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="padding: 20px 20px 0">
<a href="order.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; font-weight: 600; color: #56607A">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56607A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
Velvet evening coat
</a>
</div>
<div style="flex: 1; padding: 4px 20px 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="align-self: flex-start; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: #8A1C46; background: #FBE9F0; border-radius: 999px; padding: 4px 10px">SE-1002</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600; line-height: 1.15">Log time</h1>
</div>
<div style="background: #FFFFFF; border: 1px solid #DDE1E8; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #56607A">How long?</h2>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" aria-label="Half an hour less" id="less" style="width: 60px; height: 60px; border-radius: 16px; border: 1.5px solid #14213D; background: #FFFFFF; color: #14213D; font-size: 30px; font-family: inherit; cursor: pointer">&minus;</button>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 52px; font-weight: 600; line-height: 1"><span class="js-hours">2</span></span>
<span style="font-size: 15px; color: #56607A"><span class="js-unit">hours</span></span>
</div>
<button type="button" aria-label="Half an hour more" id="more" style="width: 60px; height: 60px; border-radius: 16px; border: 1.5px solid #14213D; background: #FFFFFF; color: #14213D; font-size: 30px; font-family: inherit; cursor: pointer">+</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #56607A">What was it?</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" class="js-kind" aria-pressed="false" style="height: 52px; border-radius: 14px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; border: 1.5px solid #C3C9D4; background: #FFFFFF; color: #14213D">Sewing</button>
<button type="button" class="js-kind" aria-pressed="true" style="height: 52px; border-radius: 14px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; border: 1.5px solid #14213D; background: #14213D; color: #FFFFFF">Fitting</button>
<button type="button" class="js-kind" aria-pressed="false" style="height: 52px; border-radius: 14px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; border: 1.5px solid #C3C9D4; background: #FFFFFF; color: #14213D">Tidying up</button>
</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #DDE1E8; border-radius: 16px; padding: 4px 16px; display: flex; align-items: center; justify-content: space-between; min-height: 56px; box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 600; color: #56607A">When?</span>
<span style="font-size: 16px; font-weight: 600">Today, Tue 10 Nov</span>
</div>
<button type="button" style="min-height: 44px; padding: 0 4px; border: 0; background: none; font-size: 15px; font-weight: 600; font-family: inherit; color: #B4235A; cursor: pointer">Change</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="note" style="font-size: 13px; font-weight: 600; color: #56607A">Note, if you like</label>
<textarea id="note" rows="2" placeholder="Fitting for the cuffs" style="box-sizing: border-box; width: 100%; border: 1px solid #C3C9D4; border-radius: 14px; padding: 12px 14px; font-size: 16px; font-family: inherit; color: #14213D; background: #FFFFFF; resize: none"></textarea>
</div>
</div>
<div style="padding: 16px 20px 24px; background: #FFFFFF; border-top: 1px solid #DDE1E8">
<a href="saved.html" style="height: 56px; border-radius: 14px; background: #B4235A; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center"><span>Save <span class="js-hours">2</span> <span class="js-unit">hours</span></span></a>
</div>
</div>
<script>
var hours = 2, ON = "height: 52px; border-radius: 14px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; border: 1.5px solid #14213D; background: #14213D; color: #FFFFFF", OFF = "height: 52px; border-radius: 14px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; border: 1.5px solid #C3C9D4; background: #FFFFFF; color: #14213D";
function show() {
  document.querySelectorAll(".js-hours").forEach(function (e) { e.textContent = hours; });
  document.querySelectorAll(".js-unit").forEach(function (e) { e.textContent = hours === 1 ? "hour" : "hours"; });
}
document.getElementById("less").onclick = function () { hours = Math.max(0.5, hours - 0.5); show(); };
document.getElementById("more").onclick = function () { hours = Math.min(16, hours + 0.5); show(); };
document.querySelectorAll(".js-kind").forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll(".js-kind").forEach(function (o) { o.setAttribute("aria-pressed", o === b); o.style.cssText = o === b ? ON : OFF; });
  };
});
</script>
</body>
</html>
