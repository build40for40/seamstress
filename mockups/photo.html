<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add photo · Seamless mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
<style>
body{margin:0;background:#EFE6E3;display:flex;justify-content:center}
body>div{width:100%!important;max-width:390px;height:100dvh!important;min-height:640px}
a{color:#2B1B33;text-decoration:none}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF6F4 repeating-linear-gradient(90deg, rgba(43, 27, 51, 0.04) 0 1px, transparent 1px 14px); color: #2B1B33; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
<div aria-hidden="true" style="flex: none; height: 18px; background-color: #2B1B33; background-image: repeating-linear-gradient(90deg, #FBF6F4 0 1.5px, transparent 1.5px 40px), repeating-linear-gradient(90deg, #CBB9C9 0 1px, transparent 1px 8px); background-size: 100% 12px, 100% 6px; background-repeat: no-repeat; background-position: left bottom, left bottom"></div>
<div style="padding: 20px 20px 0">
<a href="order.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; font-weight: 600; color: #6A5870">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6A5870" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
Velvet evening coat
</a>
</div>
<div style="flex: 1; padding: 4px 20px 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="align-self: flex-start; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #6B2443; background: #F3E1E7; border: 1px dashed #B58A9B; border-radius: 4px; padding: 3px 9px">SE-1002</span>
<h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 28px; font-weight: 600; line-height: 1.15">Show me the goods</h1>
</div>
<div style="height: 300px; border-radius: 6px; background: #E9DDDA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<svg aria-hidden="true" width="190" height="190" viewBox="0 0 24 24" fill="#F6EEEC" stroke="#54435A" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3h4v2c2 1 4 2 4 4 0 2-2 3-2 5s1 3 1 5H7c0-2 1-3 1-5s-2-3-2-5c0-2 2-3 4-4z"></path><path d="M12 19v3"></path><path d="M9 22h6"></path></svg>
<span style="font-size: 15px; font-weight: 600; color: #54435A">Your photo shows here</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 54px; border-radius: 6px; border: 1.5px solid #2B1B33; background: #2B1B33; color: #FFFFFF; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer">Take photo</button>
<button type="button" style="height: 54px; border-radius: 6px; border: 1.5px solid #2B1B33; background: #FFFFFF; color: #2B1B33; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer">From gallery</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="caption" style="font-size: 13px; font-weight: 600; color: #6A5870">What does it show?</label>
<input id="caption" type="text" placeholder="New cuffs pinned on" style="height: 52px; box-sizing: border-box; border: 1px solid #C9B9BF; border-radius: 6px; padding: 0 14px; font-size: 16px; font-family: inherit; color: #2B1B33; background: #FFFFFF">
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #6A5870">Nothing reaches the client until the atelier has had a look.</p>
</div>
<div style="padding: 16px 20px 24px; background: #FFFFFF; border-top: 1px solid #E8DCD9; display: flex; flex-direction: column; gap: 10px">
<a href="index.html" style="height: 56px; border-radius: 6px; background: #7A2E4D; outline: 1.5px dashed rgba(255, 255, 255, 0.6); outline-offset: -6px; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">Send photo</a>
<a href="index.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #6A5870">Later</a>
</div>
</div>
</body>
</html>
