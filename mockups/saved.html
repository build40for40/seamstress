<!doctype html>

<title>Time saved · Seamstress mockup</title>

<style>

<body>

<div style="flex: 1; padding: 72px 20px 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 14px">

<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 600; line-height: 1.15">Saved</h1>
<p style="margin: 0; font-size: 16px; color: #56607A">Here's what went in. Check it's right.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #DDE1E8; border-radius: 16px; padding: 4px 16px; display: flex; flex-direction: column">

</div>

<span style="font-size: 17px; font-weight: 600">Fitting</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; border-top: 1px solid #EBEEF2">
<span style="font-size: 15px; color: #56607A">Order</span>
<span style="font-size: 17px; font-weight: 600">SE-1002, velvet coat</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; border-top: 1px solid #EBEEF2">
<span style="font-size: 15px; color: #56607A">When</span>
<span style="font-size: 17px; font-weight: 600">Tue 10 Nov</span>

</div>
<p style="margin: 0; font-size: 15px; color: #56607A">That makes 7.5 hours of yours on this order.</p>
